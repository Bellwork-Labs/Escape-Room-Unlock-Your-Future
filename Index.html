<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlock Your Future</title>
<style>
:root{--bg:#060a18;--panel:#0e1631;--panel2:#141f45;--line:#25366a;--text:#eaf0ff;--muted:#9fb0dc;--cyan:#3be3ff;--mag:#ff5ad9;--lime:#6dffa0;--amber:#ffcb52;--red:#ff7486;--violet:#a796ff;--acc:#3be3ff;--fs:17px}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(ellipse at 15% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 55%),
 radial-gradient(ellipse at 105% 110%,rgba(255,90,217,.13),transparent 50%),
 linear-gradient(rgba(59,227,255,.045) 1px,transparent 1px) 0 0/44px 44px,
 linear-gradient(90deg,rgba(59,227,255,.045) 1px,transparent 1px) 0 0/44px 44px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.mono{font-family:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace}
.small{font-size:.85rem}.muted{color:var(--muted)}.center{text-align:center}
[hidden]{display:none!important}

/* HUD */
#hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(6,10,24,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.2em;font-size:.72rem;color:var(--cyan);white-space:nowrap}
.brand b{color:var(--mag)}
#hudAgent{font-size:.8rem;color:var(--muted);white-space:nowrap}
.hud-mid{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0}
#hudProg{display:flex;gap:5px;width:min(240px,30vw)}
.hud-seg{flex:1;height:8px;border-radius:4px;background:#1b2754}
.hud-seg.done{background:linear-gradient(90deg,var(--cyan),var(--lime));box-shadow:0 0 8px rgba(59,227,255,.6)}
.hud-seg.cur{background:var(--acc);opacity:.55;animation:pulse 1.6s infinite}
#hudLabel{font-size:.75rem;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:6px}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.8rem;min-height:38px;white-space:nowrap}
.tool:hover{border-color:var(--acc)}
.tool[aria-pressed="true"]{background:var(--acc);color:#04101c;border-color:var(--acc)}

main#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 20px 130px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em}
h1{font-size:2.2rem;letter-spacing:-.01em}
h2{font-size:1.6rem}
.eyebrow{font-size:.72rem;letter-spacing:.22em;color:var(--acc);font-weight:700}
.lead{font-size:1.12rem;color:#cdd7f5;max-width:720px}
.sub{color:var(--muted);margin:.2em 0 1.1em}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 20px;font-weight:700;min-height:48px}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#03101b;box-shadow:0 0 22px color-mix(in srgb,var(--acc) 45%,transparent)}
.btn.primary:disabled{background:#26345e;border-color:#26345e;color:#7d8bb5;box-shadow:none}
.btn.ghost{background:transparent}
.btn.big{font-size:1.1rem;padding:15px 28px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}

/* Title */
.title{text-align:center;padding-top:10px}
.title .lead{margin:0 auto 14px}
.lock-art{width:150px;height:150px;margin:0 auto 6px;filter:drop-shadow(0 0 20px rgba(59,227,255,.45))}
.lock-art svg{width:100%;height:100%}
.spin{transform-origin:100px 100px;animation:spin 30s linear infinite}
.glitch{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:900;letter-spacing:.02em;background:linear-gradient(90deg,var(--cyan),#fff 45%,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;margin:.1em 0 .3em}
.rules{list-style:none;padding:0;margin:18px auto;display:grid;gap:10px;max-width:640px;text-align:left}
.rules li{background:rgba(14,22,49,.8);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rules b{color:var(--lime)}
.login{max-width:480px;margin:22px auto 10px;text-align:left;display:grid;gap:12px}
.field{display:grid;gap:6px}
.field>span{font-size:.85rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.tb{width:100%;background:#070d22;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;resize:vertical}
.tb:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.err{color:var(--red);font-weight:600;min-height:1.2em}
.fine{color:var(--muted);font-size:.85rem}

/* Hub */
.keybar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:18px 0 22px}
.keys{display:flex;gap:8px}
.keyslot{width:46px;height:54px;border-radius:10px;border:2px dashed #34477f;display:grid;place-items:center;font:900 1.5rem ui-monospace,monospace;color:#3a4c80}
.keyslot.got{border:2px solid var(--lime);color:var(--lime);background:rgba(109,255,160,.08);box-shadow:0 0 14px rgba(109,255,160,.35)}
.bigbar{flex:1;min-width:160px;height:12px;border-radius:6px;background:#1b2754;overflow:hidden}
.bigbar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .8s}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.mtile{--mc:var(--cyan);text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.mtile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0,color-mix(in srgb,var(--mc) 25%,transparent),transparent 55%);pointer-events:none}
.mtile.open{border-color:var(--mc);box-shadow:0 0 24px color-mix(in srgb,var(--mc) 30%,transparent)}
.mtile.open:hover,.mtile.done:hover{transform:translateY(-3px)}
.mtile.done{border-color:color-mix(in srgb,var(--lime) 60%,var(--line))}
.mtile.locked{opacity:.5;filter:grayscale(.7)}
.mt-top{display:flex;justify-content:space-between;gap:8px;font-size:.7rem;letter-spacing:.14em}
.mt-code{color:var(--mc)}
.mtile.done .mt-status{color:var(--lime)}
.mtile.open .mt-status{color:var(--mc)}
.mt-icon{font-size:2.4rem;margin:8px 0 2px}
.mtile h3{font-size:1.25rem;margin:4px 0}
.mtile p{margin:0 0 10px;color:#cdd7f5}
.mt-foot{color:var(--muted)}
.teacher-link{text-align:center;margin-top:30px}

/* Mission */
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mh-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip-code{font-size:.7rem;letter-spacing:.18em;border:1px solid var(--acc);color:var(--acc);border-radius:20px;padding:3px 10px}
.mh-name{font-weight:800}
.dots{display:flex;gap:6px}
.dot{width:22px;height:6px;border-radius:3px;background:#24325e}
.dot.done{background:var(--acc);opacity:.6}.dot.cur{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.prompt{font-size:1.6rem}
.stage{animation:rise .35s ease-out}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(6,10,24,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.navin{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.hint{flex:1;text-align:right;color:var(--amber)}

.intro{max-width:720px}
.intro-icon{font-size:3.4rem;filter:drop-shadow(0 0 16px var(--acc))}
.intro p{font-size:1.12rem;color:#d6def7}
.brief{list-style:none;padding:0;display:grid;gap:8px;margin-top:18px}
.brief li{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;background:rgba(14,22,49,.7)}
.brief li::before{content:"▸ ";color:var(--acc);font-weight:900}

.grid{display:grid;gap:12px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.tiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;position:relative;transition:border-color .12s,transform .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.opt .ic{font-size:1.6rem}
.opt .desc{color:var(--muted);font-size:.92rem}
.opt[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel));box-shadow:0 0 18px color-mix(in srgb,var(--acc) 30%,transparent)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#03101b;font-weight:900;display:grid;place-items:center}
.tiles .opt{grid-template-columns:auto 1fr;align-items:center;gap:10px;padding:12px}
.tiles .opt .ic{font-size:1.4rem}
.counter{display:inline-block;font-weight:700;margin-bottom:12px;padding:4px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.counter.flash{animation:shake .4s;border-color:var(--amber);color:var(--amber)}
.other{margin-top:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:#0a1430;border:1px solid var(--line);border-radius:22px;padding:7px 14px;font-size:.9rem}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);color:#03101b;border-color:var(--acc);font-weight:700}
.chips.big .chip{padding:11px 18px;font-size:1rem;border-radius:14px;min-height:46px;text-align:left}
.exbox{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:16px;margin-bottom:14px}
.exhead{font-size:1.15rem}

/* meters */
.meters{display:grid;gap:10px}
.meter{display:grid;grid-template-columns:minmax(150px,1.2fr) auto 90px;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.segs{display:flex;gap:5px}
.seg{width:44px;height:34px;border-radius:7px;border:1px solid #33467e;background:#0a1430;padding:0}
.seg.on{background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 50%,#000));border-color:var(--acc);box-shadow:0 0 8px color-mix(in srgb,var(--acc) 50%,transparent)}
.meter-val{font-weight:700;color:var(--acc);font-size:.9rem}
.meter-legend{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}

/* scenario */
.alert{border:1px solid color-mix(in srgb,var(--amber) 60%,var(--line));background:linear-gradient(135deg,rgba(255,203,82,.08),rgba(14,22,49,.9) 50%);border-radius:18px;padding:20px 22px;margin-bottom:18px}
.alert-tag{font:700 .72rem ui-monospace,monospace;letter-spacing:.2em;color:var(--amber);animation:blink 1.4s infinite}
.alert h2{margin:.3em 0}
.alert .lead{margin:0}
.q{font-size:1.2rem;margin:18px 0 10px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.05rem}
.choice:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.choice .key{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--acc);color:var(--acc);display:grid;place-items:center;font:800 .95rem ui-monospace,monospace}
.choice[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
.choice[aria-pressed="true"] .key{background:var(--acc);color:#03101b}
.fu{margin-top:6px}
.log{margin-top:16px;padding:10px 14px;border-radius:12px;background:rgba(109,255,160,.07);border:1px solid rgba(109,255,160,.35);animation:rise .3s}
.log-tag{font:800 .7rem ui-monospace,monospace;letter-spacing:.18em;color:var(--lime)}

/* sort */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:14px;border-radius:14px;border:1px dashed var(--line);background:rgba(10,20,48,.6);margin-bottom:14px}
.tray-empty{color:var(--lime);font-weight:700}
.tok{background:#132150;border:1px solid #34497f;border-radius:10px;padding:8px 12px;font-size:.92rem}
.tok.picked{background:var(--acc);color:#03101b;border-color:var(--acc);box-shadow:0 0 14px var(--acc);font-weight:700}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bin{--bc:var(--acc);border:2px solid color-mix(in srgb,var(--bc) 55%,transparent);border-radius:14px;background:color-mix(in srgb,var(--bc) 6%,var(--panel));min-height:170px;display:flex;flex-direction:column}
.bin.over{background:color-mix(in srgb,var(--bc) 20%,var(--panel))}
.bin-head{background:color-mix(in srgb,var(--bc) 16%,transparent);border:0;border-bottom:1px solid color-mix(in srgb,var(--bc) 40%,transparent);border-radius:12px 12px 0 0;padding:10px;font-weight:800;color:var(--bc);display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:52px;text-align:left}
.bin-head:hover{background:color-mix(in srgb,var(--bc) 28%,transparent)}
.bin-zone{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.bin-zone .tok{font-size:.82rem;text-align:left}
.sort-status{color:var(--amber);min-height:1.4em;font-weight:600}

/* swipe */
.swipe{display:grid;justify-items:center;gap:14px;margin:6px 0 14px}
.scard{width:min(520px,100%);text-align:center;background:linear-gradient(160deg,var(--panel2),#0a1230);border:2px solid var(--acc);border-radius:22px;padding:22px;box-shadow:0 0 30px color-mix(in srgb,var(--acc) 30%,transparent);animation:cardin .35s ease-out}
.scard-n{font:700 .75rem ui-monospace,monospace;color:var(--muted);letter-spacing:.15em}
.scard-ic{font-size:3.6rem;margin:6px 0}
.scard h3{font-size:1.5rem;margin:0}
.scard p{color:#cfd8f5;margin:.4em 0}
.scard-path{font-size:.8rem;color:var(--muted);margin-top:10px;letter-spacing:.04em}
.facts{display:grid;gap:6px;margin-top:12px;text-align:left}
.fact{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:baseline;background:#0a1430;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.92rem}
.fl{font:800 .66rem ui-monospace,monospace;letter-spacing:.12em;color:var(--acc)}
.tier{color:var(--lime);font-family:ui-monospace,monospace;margin-right:4px}
.swipe-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sbtn{border-radius:14px;padding:12px 20px;font-weight:800;border:2px solid;background:var(--panel);min-width:130px;min-height:52px}
.sbtn.yes{border-color:var(--lime);color:var(--lime)}.sbtn.maybe{border-color:var(--amber);color:var(--amber)}.sbtn.no{border-color:#7b88b3;color:#b9c3e3}
.sbtn[aria-pressed="true"].yes{background:var(--lime);color:#03101b}.sbtn[aria-pressed="true"].maybe{background:var(--amber);color:#03101b}.sbtn[aria-pressed="true"].no{background:#7b88b3;color:#03101b}
.swipe-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{font-size:.78rem;border-radius:8px;padding:5px 9px;border:1px solid var(--line);background:#0a1430}
.mini.yes{border-color:var(--lime);color:var(--lime)}.mini.maybe{border-color:var(--amber);color:var(--amber)}.mini.no{opacity:.55}
.mini.cur{outline:2px solid var(--acc)}
.banner{background:rgba(109,255,160,.1);border:1px solid var(--lime);color:var(--lime);padding:10px 14px;border-radius:12px;font-weight:700;text-align:center}

/* this or that */
.tot{display:grid;gap:10px}
.tot-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.tot-btn{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:1.05rem;font-weight:700;min-height:56px}
.tot-btn.mid{font-size:.85rem;font-weight:600;color:var(--muted);padding:8px 14px}
.tot-btn[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--panel));color:var(--text)}

/* rate */
.rate{display:grid;gap:10px}
.rate-row{display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rate-row.set{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.rate-opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.rate-opts .chip{font-size:.85rem}

/* rank */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.slot{min-height:76px;border-radius:14px;border:2px dashed #34477f;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(10,20,48,.6);text-align:left}
.slot .n{font:900 1.5rem ui-monospace,monospace;color:#3a4c80}
.slot.full{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--panel))}
.slot.full .n{color:var(--acc)}
.slot .x{margin-left:auto;color:var(--muted);font-size:.8rem}

/* budget */
.wallet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;position:sticky;top:60px;z-index:5}
.wbox{background:#0a1230;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wbox .lab{font:700 .7rem ui-monospace,monospace;letter-spacing:.16em;color:var(--muted)}
.wbox .val{font:800 1.5rem ui-monospace,monospace}
.wbox.ok .val{color:var(--lime)}.wbox.bad{border-color:var(--red)}.wbox.bad .val{color:var(--red)}
.brow{display:grid;grid-template-columns:minmax(170px,1fr) 2fr 80px;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.brow .typ{display:block;font-size:.75rem;color:var(--muted)}
.brow input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.brow .amt{font:800 1.05rem ui-monospace,monospace;text-align:right}
.budget-msg{margin:10px 0;font-weight:600}

/* blueprint builder */
.bpb{display:grid;gap:16px}
.bpb-sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.bpb-sec h3{font-size:1.05rem;margin:0 0 4px;color:var(--acc)}
.tagrow{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid var(--acc);border-radius:20px;padding:5px 12px;font-weight:700}

/* unlock */
.vault{display:grid;justify-items:center;gap:18px;padding:20px 0}
.vault-door{width:230px;height:230px;position:relative}
.vault-door svg{width:100%;height:100%;filter:drop-shadow(0 0 24px var(--acc))}
.vault.opening .wheel{animation:spin 1.4s cubic-bezier(.6,0,.3,1) forwards}
.vault.opening .vault-door{animation:open 1.8s .9s ease-in forwards}
.wheel{transform-origin:100px 100px}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,6,16,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .3s}
.award{max-width:460px;width:100%;text-align:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--lime);border-radius:24px;padding:28px;box-shadow:0 0 50px rgba(109,255,160,.35);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.award .glyph{width:110px;height:110px;margin:12px auto;border-radius:22px;display:grid;place-items:center;font:900 3.6rem ui-monospace,monospace;color:var(--lime);border:3px solid var(--lime);box-shadow:0 0 30px rgba(109,255,160,.5);animation:glow 1.8s infinite}

/* complete / blueprint screen */
.bp{position:relative;border-radius:22px;padding:2px;background:linear-gradient(135deg,var(--cyan),var(--mag),var(--lime));margin:18px 0}
.bp-in{background:#0a1130;border-radius:20px;padding:24px}
.bp-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.bp-head h2{margin:0}
.bp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bp-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bp-item .lab{font:700 .7rem ui-monospace,monospace;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}
.bp-item .val{font-weight:600;margin-top:4px;white-space:pre-line}
.bp-item.wide{grid-column:1/-1}
.paper{background:#fff;color:#14182b;border-radius:14px;padding:28px;margin-top:16px}
.note{border:1px solid color-mix(in srgb,var(--amber) 50%,var(--line));background:rgba(255,203,82,.07);border-radius:12px;padding:12px 14px;color:#f3e2b5;font-size:.92rem}

#print{display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes blink{50%{opacity:.45}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardin{from{opacity:0;transform:translateX(40px) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 50px rgba(109,255,160,.85)}}
@keyframes open{to{transform:scale(1.6);opacity:0}}

@media (max-width:760px){
 h1{font-size:1.7rem}.prompt{font-size:1.3rem}
 .bins{grid-template-columns:1fr 1fr}
 .meter{grid-template-columns:1fr;gap:6px}
 .rate-row{grid-template-columns:1fr}.rate-opts{justify-content:flex-start}
 .brow{grid-template-columns:1fr 70px}.brow input{grid-column:1/-1;grid-row:2}
 .slots{grid-template-columns:1fr}
 .tot-row{grid-template-columns:1fr 1fr}.tot-btn.mid{grid-column:1/-1;grid-row:2}
 .wallet{grid-template-columns:1fr 1fr 1fr}.wbox .val{font-size:1.1rem}
 #hudProg,#hudLabel{display:none}.brand{display:none}.tools .tool{padding:6px 8px}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

@media print{
 body{background:#fff;color:#000}
 body::before,#hud,#app,.overlay,.navbar,#confetti{display:none!important}
 #print{display:block}
 @page{margin:14mm}
}

 add("Postsecondary education / training",[["Primary pathway",(r.pathway||[]).length?lab("pathway",r.pathway[0]):null],["Backup pathway",(r.backup||[]).length&&r.backup[0]!==(r.pathway||[])[0]?lab("backup",r.backup[0]):"None selected"],nkRow("train"),nkRow("applySchool"),nkRow("who")]);
 const env=r.workenv||{};
 const envL=STEPS.workenv.pairs.map(p=>env[p.id]==="either"?null:env[p.id]?noEmo(p[env[p.id]]):null).filter(Boolean);
 add("Postsecondary employment & career interests",[["Careers marked Interested",joinL(byVal("careers","yes"))],["Careers marked Maybe",joinL(byVal("careers","maybe"))],["Training levels of Interested careers",careerMix("tl",t=>TL[t])],["Fields of Interested careers",careerMix("cluster",x=>x)],["Pay levels of Interested careers",careerMix("pay",k=>payTier(k))],["Dream job (student's words)",quote(r.dreamjob)],["Career interest chosen for blueprint",r.bp_career||null],["Preferred work environment",joinL(envL)||(Object.keys(env).length?"No strong preferences":null)],["Work experience",joinL(pickL("workexp"))],nkRow("applyJob"),nkRow("resume"),nkRow("interview"),nkRow("pay")]);
 const b=r.budget||{};const bt=Object.values(b).reduce((a,c)=>a+c,0);
 const bStr=bt?STEPS.budget.cats.map(c=>`${c.label} $${(b[c.id]||0).toLocaleString()}`).join("; "):null;
 const ls=r.lifeskills||{};
 add("Independent living — functional skills & problem-solving",[
  ["Monthly budget plan ($2,000 income)",bStr?bStr+`. Total planned: $${bt.toLocaleString()} (${bt>2000?"over by $"+(bt-2000).toLocaleString():bt<2000?"$"+(2000-bt).toLocaleString()+" unplanned":"balanced"}).`:null],
  ["Current money management",joinL(pickL("money"))],
  ...["rs_ride","rs_late","rs_bill","rs_sick","rs_leak"].map(id=>[STEPS[id].title,scen(id)]),
  ["Life skills: “I've got this”",joinL(byVal("lifeskills","I've got this"))||(Object.keys(ls).length?"None":null)],
  ["Life skills: “Need some help”",joinL(byVal("lifeskills","Need some help"))||(Object.keys(ls).length?"None":null)],
  ["Life skills: “Need to learn”",joinL(byVal("lifeskills","Need to learn"))||(Object.keys(ls).length?"None":null)],
  ["Planned living situation",(r.living||[]).length?lab("living",r.living[0]):null]]);
 add("Student priorities & vision",[["Priorities for annual goals (ranked)",rankL("priorities")],["Personal goal",quote(r.bp_goal)],["Next step student chose",r.bp_next||null],["Vision (5 years)",quote(r.vision)],["What student wants the team to know",quote(r.teamknow)||"—"]]);

 // discussion points
 const indepNot=["rs_ride","rs_late","rs_bill","rs_sick","rs_leak"].filter(id=>r[id]&&r[id].fu&&/^Not yet/.test(r[id].fu)).map(id=>STEPS[id].title);
 if(sa.knowAcc&&sa.knowAcc!=="Yes, most of them")notes.push(`Student reports knowing ${sa.knowAcc==="Some of them"?"some":"few or none"} of their IEP accommodations — consider reviewing accommodations with the student before or during the meeting.`);
 if(r.sc_crisis&&r.sc_crisis.choice==="wait")notes.push(`When directions are unclear, student chose to wait; follow-up: “${r.sc_crisis.fu||"—"}.” Consider discussing strategies for requesting clarification.`);
 if(r.sc_absent&&r.sc_absent.choice==="quiet")notes.push("After missing class, student chose to say nothing and try to keep up — a possible self-advocacy discussion point.");
 if(sa.speakUp==="Nervous"||sa.speakUp==="I'd rather not")notes.push(`Student describes feeling “${sa.speakUp}” about speaking up for needs; consider a self-advocacy goal or a supported way to participate in the meeting.`);
 if(hv.length)notes.push(`Supports the student has not tried: ${hv.join(", ")}. Team may discuss whether a trial is appropriate.`);
 if(hn.length)notes.push(`Supports the student reports do not help: ${hn.join(", ")}. Consider reviewing whether these remain appropriate.`);
 if(lo.length)notes.push(`Lower self-rated confidence: ${lo.join(", ")}.`);
 if(r.pathway&&r.pathway[0]==="unsure")notes.push("Student is still deciding on a postsecondary pathway; additional career exploration or interest inventories may support planning.");
 const notYet=Object.keys(nk).filter(k=>nk[k]==="Not yet").map(k=>lab("nextknow",k));
 if(notYet.length>=2)notes.push(`Student reports not yet knowing: ${notYet.join("; ")}. These may inform transition activities.`);
 if((r.workexp||[]).includes("none"))notes.push("Student reports no work experience yet; work-based learning opportunities may be worth discussing.");
 const need=byVal("lifeskills","Need to learn");if(need.length)notes.push(`Life skills student wants to learn: ${need.join(", ")}. Possible areas for independent-living instruction.`);
 if(indepNot.length)notes.push(`Student reports they could not yet handle these situations independently: ${indepNot.join(", ")}.`);
 if(bt>2000)notes.push(`Student's practice budget exceeded income by $${(bt-2000).toLocaleString()} — possible financial-literacy discussion point.`);
 notes.push("Confirm student-reported information with formal transition assessments, observations, and family input.");

 // at a glance
 const ws=(r.workexp||[]);
 const glance=[
  ["Academic strengths",(r.strengths||[]).length?`Identifies as ${joinL(pickL("strengths"))}`+((r.learnways||[]).length?`; learns best by ${lab("learnways",r.learnways[0]).toLowerCase()}`:"")+".":null],
  ["Academic needs",[pickL("growth").length?"Wants to improve "+joinL(pickL("growth")).toLowerCase():null,lo.length?"lower confidence in "+lo.join(", ").toLowerCase():null].filter(Boolean).join("; ")||null],
  ["Supports",hl.length?"Reports these help a lot: "+hl.join(", ")+".":null],
  ["Self-advocacy",sa.speakUp?`Feels “${sa.speakUp}” speaking up; knows accommodations: “${sa.knowAcc||"—"}.”`+(r.bp_goal?` Goal: “${r.bp_goal.trim()}.”`:""):null],
  ["Postsecondary employment",(r.bp_career||byVal("careers","yes").length)?(r.bp_career&&r.bp_career!=="Still exploring"?`Career interest: “${r.bp_career}”`:`Interested in ${joinL(byVal("careers","yes"))||"still exploring"}`)+(ws.length&&!ws.includes("none")?`; experience: ${joinL(pickL("workexp")).toLowerCase()}.`:"; no work experience yet."):null],
  ["Education / training",(r.pathway||[]).length?`Plans: ${lab("pathway",r.pathway[0])}`+((r.backup||[]).length&&r.backup[0]!==r.pathway[0]?`; backup: ${lab("backup",r.backup[0])}.`:"."):null],
  ["Independent living",Object.keys(ls).length?(need.length?`Wants to learn: ${need.join(", ")}.`:"Reports independence or partial independence in listed skills.")+((r.living||[]).length?` Plans to live: ${lab("living",r.living[0]).toLowerCase()}.`:""):null]];
 return {sections:sec,notes,glance};
}

function blueprintData(){
 const r=S.r;
 const strengths=(r.strengths||[]).map(id=>lab("strengths",id));
 const ex=(r.strengths||[]).map(id=>(r["ex_"+id]||"").trim()?`${lab("strengths",id)}: ${(r["ex_"+id]||"").trim()}`:null).filter(Boolean);
 const helps=byVal("supports","alot");
 return [
  {l:"My strengths",i:"💪",v:joinL(strengths),wide:false},
  {l:"My career interest",i:"🚀",v:r.bp_career},
  {l:"My path after high school",i:"🧭",v:(r.pathway||[]).length?lab("pathway",r.pathway[0]):null},
  {l:"My next step",i:"👣",v:r.bp_next},
  {l:"A support that helps me",i:"🧰",v:r.bp_support?r.bp_support+(helps.length>1?`\nAlso helps: ${helps.filter(x=>x!==r.bp_support).join(", ")}`:""):null},
  {l:"My personal goal",i:"🎯",v:(r.bp_goal||"").trim()||null},
  {l:"How I learn best",i:"🧠",v:(r.learnways||[]).map(id=>lab("learnways",id)).join(" → ")||null},
  {l:"I want my IEP team to focus on",i:"📌",v:(r.priorities||[]).map((id,i)=>`${i+1}. ${lab("priorities",id)}`).join("\n")||null},
  {l:"Things I'm into",i:"⭐",v:joinL(pickL("interests").concat((r.interests_other||"").trim()?[(r.interests_other||"").trim()]:[]))},
  {l:"In my IEP meeting, I want to",i:"🎤",v:joinL(pickL("meeting"))},
  {l:"Life skills I've got",i:"✅",v:joinL(byVal("lifeskills","I've got this"))},
  {l:"Life skills I want to learn",i:"📈",v:joinL(byVal("lifeskills","Need to learn").concat(byVal("lifeskills","Need some help")))},
  {l:"Proof of my strengths",i:"🔎",v:ex.join("\n")||null,wide:true},
  {l:"My vision for after graduation",i:"🌅",v:(r.vision||"").trim()||null,wide:true},
  {l:"What I want my team to know",i:"💬",v:(r.teamknow||"").trim()||null,wide:true}
 ].filter(x=>x.v);
}

/* ---- documents (print / download) ---- */
function blueprintDoc(){
 const d=blueprintData();
 return h("div",{class:"pd"},
  h("div",{class:"pd-head"},h("div",{},h("div",{class:"pd-kicker"},"UNLOCK YOUR FUTURE · MISSION COMPLETE"),h("h1",{},"My Future Blueprint")),h("div",{class:"pd-meta"},h("strong",{},S.name),h("br"),(S.grade?"Grade "+S.grade+" · ":"")+fmtDate(S.finished||Date.now()))),
  h("div",{class:"pd-bp"},d.map(x=>h("div",{class:"pd-box"+(x.wide?" wide":"")},h("div",{class:"l"},x.i+" "+x.l),h("div",{class:"v"},x.v)))),
  h("p",{class:"pd-sign"},"I'll bring this blueprint to my IEP meeting.  Signature: ________________________"));
}
function teacherDoc(){
 const d=teacherData();
 const tbl=(title,items,cls)=>h("table",{class:"pd-table"},h("thead",{},h("tr",{},h("th",{colspan:"2"},title))),h("tbody",{},items.map(([k,v])=>h("tr",{},h("td",{class:"k"},k),h("td",{class:v?"":"need"},v||NEED)))));
 return h("div",{class:"pd"},
  h("div",{class:"pd-head"},h("div",{},h("div",{class:"pd-kicker"},"IEP PREPARATION SUMMARY · STUDENT INPUT"),h("h1",{},S.name||"Student")),h("div",{class:"pd-meta"},(S.grade?"Grade "+S.grade+" · ":"")+fmtDate(S.finished||Date.now()),h("br"),`${doneCount()}/5 missions completed`)),
  h("p",{class:"pd-disc"},h("strong",{},"Self-reported information. "),"These responses come from the student-facing “Unlock Your Future” activity. They are the student's own perspective — not independently verified findings or automatically generated IEP determinations. Use alongside formal transition assessments and other IEP data sources."),
  tbl("At a glance",d.glance),
  h("h2",{},"Transition-planning discussion points"),h("ul",{},d.notes.map(n=>h("li",{},n))),
  d.sections.map(s=>tbl(s.cat,s.items)),
  h("p",{class:"pd-sign"},"Store this summary only in your district-approved system."));
}
function printDoc(node){const p=$("#print");p.innerHTML="";p.append(node);window.print();}
function fileBase(kind){return `${kind}_${(S.name||"student").replace(/[^\w-]+/g,"_")}_${new Date().toISOString().slice(0,10)}`;}
function download(name,content,type){const b=new Blob([content],{type});const a=h("a",{href:URL.createObjectURL(b),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);S.saved=true;}
function htmlFile(title,nodes){return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${title}</title><style>body{margin:24px auto;max-width:900px;padding:0 16px;background:#fff}${$("#pdcss").textContent}@media print{body{margin:0}}</style></head><body>${nodes.map(n=>n.outerHTML).join('<div class="pd-break"></div>')}</body></html>`;}
function csv(){
 const d=teacherData(),rows=[["Category","Item","Student response"]];
 d.glance.forEach(([k,v])=>rows.push(["At a glance",k,v||NEED]));
 d.sections.forEach(s=>s.items.forEach(([k,v])=>rows.push([s.cat,k,v||NEED])));
 d.notes.forEach(n=>rows.push(["Discussion points","",n]));
 return "﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
}

function resetAll(){if(!confirm("Start over for a new student? Make sure this student's summary and blueprint are saved first — all answers on this computer will be cleared."))return;
 Object.assign(S,{view:"title",name:"",first:"",init:"",grade:"",m:0,s:0,done:[false,false,false,false,false],r:{},t:[0,0,0,0,0],enter:0,started:null,finished:null,back:"hub",saved:false});render();}

/* ---------- tools ---------- */
const synth=window.speechSynthesis;
function stopSpeak(){if(synth&&synth.speaking)synth.cancel();const b=$("#readBtn");if(b)b.setAttribute("aria-pressed","false");}
function speak(){if(!synth)return;if(synth.speaking){stopSpeak();return;}
 const root=$("#app .stage")||$("#app");let txt=root.innerText.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu,"").replace(/\n{2,}/g,"\n").slice(0,5000);
 const u=new SpeechSynthesisUtterance(txt);u.rate=.95;u.onend=u.onerror=()=>$("#readBtn").setAttribute("aria-pressed","false");synth.speak(u);$("#readBtn").setAttribute("aria-pressed","true");}
if(!synth)$("#readBtn").hidden=true;
$("#readBtn").onclick=speak;
const SIZES=[17,19,21];let sz=0;
$("#sizeBtn").onclick=()=>{sz=(sz+1)%SIZES.length;document.documentElement.style.setProperty("--fs",SIZES[sz]+"px");};
$("#mapBtn").onclick=()=>{if(S.view==="mission")leaveMission();S.view="hub";render();};
window.addEventListener("beforeunload",e=>{if(S.name&&!S.saved){e.preventDefault();e.returnValue="";}});

function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const c=$("#confetti");c.hidden=false;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cols=["#3be3ff","#ff5ad9","#6dffa0","#ffcb52","#a796ff"];
 const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:4+Math.random()*6,r:Math.random()*6,c:cols[Math.random()*5|0]}));
 const t0=performance.now();
 (function f(t){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
  if(t-t0<3500)requestAnimationFrame(f);else{x.clearRect(0,0,c.width,c.height);c.hidden=true;}})(t0);
}
